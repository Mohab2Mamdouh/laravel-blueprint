services:
  # PHP workspace: run composer, artisan, and the test suite here.
  #   docker compose run --rm app composer install
  #   docker compose run --rm app vendor/bin/phpunit
  app:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    working_dir: /app
    volumes:
      - .:/app
      - composer-cache:/home/app/.composer
    environment:
      # Matches the test DB service below; used if the package tests hit MySQL.
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: blueprint_test
      DB_USERNAME: blueprint
      DB_PASSWORD: secret
    depends_on:
      mysql:
        condition: service_healthy
    # Keep the container up for `docker compose exec app sh` sessions.
    tty: true
    stdin_open: true

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: blueprint_test
      MYSQL_USER: blueprint
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    # Bind to localhost only so the DB isn't exposed on the network.
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  composer-cache:
  mysql-data:
